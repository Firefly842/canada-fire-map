<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Canada fire map self-test</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    body { margin: 16px; background: Canvas; color: CanvasText; font-size: 13px; }
    h1 { font-size: 17px; }
    #summary { font-weight: 650; margin: 8px 0 12px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent); padding: 3px 6px; text-align: left; vertical-align: top; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pass { color: #0b7a0b; font-weight: 600; }
    .fail { color: #c22; font-weight: 600; }

<body>
<h1>Canada fire map: data self-test</h1>
<p>Every file the bundle's manifest lists is fetched, its size and SHA-256 are compared with the manifest, and it is
  decoded (packs by their header, JSON by parsing, images by drawing them).</p>
<div id="summary" data-status="running">Running…</div>
<table>
  <thead><tr><th>File</th><th class="num">Bytes</th><th>Result</th><th>Detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
